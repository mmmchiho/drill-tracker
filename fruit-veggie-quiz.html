<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くだもの・やさい わけてみよう</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

  :root {
    --fruit-color: #FF6B6B;
    --veggie-color: #4CAF7D;
    --accent: #FFD93D;
    --text: #3D2B1F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: #FFF8E7;
    min-height: 100vh;
    overflow-x: hidden;
    color: var(--text);
  }

  .sky-bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg, #87CEEB 0%, #B0E2FF 40%, #FFF8E7 70%, #D4A056 90%, #8B5E3C 100%);
  }

  .cloud {
    position: fixed;
    background: white;
    border-radius: 50px;
    opacity: 0.85;
    animation: floatCloud linear infinite;
  }
  .cloud::before, .cloud::after { content:''; position:absolute; background:white; border-radius:50%; }
  .c1 { width:120px;height:40px;top:8%;left:-140px;animation-duration:28s; }
  .c1::before{width:60px;height:55px;top:-30px;left:15px;}
  .c1::after{width:45px;height:45px;top:-22px;left:55px;}
  .c2 { width:90px;height:30px;top:18%;left:-110px;animation-duration:22s;animation-delay:-8s;opacity:0.65; }
  .c2::before{width:40px;height:40px;top:-24px;left:10px;}
  .c2::after{width:35px;height:35px;top:-18px;left:42px;}
  .c3 { width:150px;height:45px;top:5%;left:-170px;animation-duration:35s;animation-delay:-15s;opacity:0.7; }
  .c3::before{width:70px;height:65px;top:-36px;left:20px;}
  .c3::after{width:55px;height:50px;top:-28px;left:75px;}
  @keyframes floatCloud { from{left:-200px;} to{left:110%;} }

  .tree-scene {
    position:fixed; bottom:60px; left:50%;
    transform:translateX(-50%);
    width:140px; display:flex; flex-direction:column; align-items:center;
    z-index:1; pointer-events:none;
  }
  .tree-top {
    width:130px;height:110px;
    background:radial-gradient(ellipse at 50% 60%,#5DA84E,#3D8040);
    border-radius:50% 50% 40% 40%;
    box-shadow:inset -8px -8px 20px rgba(0,0,0,0.2);
    position:relative;
  }
  .tree-top::after {
    content:'';position:absolute;width:90px;height:80px;
    background:radial-gradient(ellipse,#6FC45E,#4D9050);
    border-radius:50% 50% 40% 40%;top:-25px;left:20px;
  }
  .tree-trunk { width:32px;height:55px;background:linear-gradient(to right,#8B5E3C,#A0723F,#7A5230);border-radius:4px 4px 8px 8px; }
  .ground-strip { position:fixed;bottom:0;left:0;right:0;height:65px;background:linear-gradient(180deg,#6BBF59 0%,#4E9E40 30%,#8B5E3C 60%);z-index:1; }

  .container { position:relative;z-index:10;max-width:600px;margin:0 auto;padding:16px 16px 120px; }

  .title-box {
    text-align:center;margin-bottom:16px;padding:14px 20px 10px;
    background:rgba(255,255,255,0.88);border-radius:24px;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
  }
  .title-box h1 { font-family:'Kaisei Decol',serif;font-size:1.6rem;color:var(--text);line-height:1.3; }
  .title-box p  { font-size:0.8rem;color:#888;margin-top:4px; }

  /* おぼえておこう */
  .rule-box {
    background:rgba(255,255,255,0.9);border-radius:20px;
    padding:14px 16px;margin-bottom:14px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
  }
  .rule-box h3 { font-size:0.9rem;margin-bottom:10px; }
  .rule-item { display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;font-size:0.85rem;line-height:1.6; }
  .rule-icon { font-size:1.8rem;flex-shrink:0; }

  /* SCORE */
  .score-bar {
    display:flex;justify-content:space-between;align-items:center;
    background:rgba(255,255,255,0.88);border-radius:18px;
    padding:10px 18px;margin-bottom:14px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
  }
  .score-item { text-align:center; }
  .score-num  { font-size:1.6rem;font-weight:800; }
  .score-label{ font-size:0.7rem;color:#888; }
  .score-correct .score-num { color:var(--fruit-color); }

  .progress-bar { height:8px;background:#eee;border-radius:4px;margin-bottom:16px;overflow:hidden; }
  .progress-fill { height:100%;background:linear-gradient(90deg,#FF6B6B,#FFD93D);border-radius:4px;transition:width 0.4s ease; }

  /* CARD */
  .card {
    background:rgba(255,255,255,0.95);border-radius:28px;
    padding:24px 20px 20px;margin-bottom:16px;
    box-shadow:0 8px 32px rgba(0,0,0,0.12);text-align:center;
  }

  .food-emoji {
    font-size:5rem;line-height:1;margin:8px 0 12px;
    animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);display:block;
  }
  @keyframes popIn {
    from{transform:scale(0.3) rotate(-10deg);opacity:0;}
    to{transform:scale(1) rotate(0deg);opacity:1;}
  }

  .food-name { font-size:1.6rem;font-weight:800;margin-bottom:16px; }

  /* BUTTONS */
  .choice-row { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
  .choice-btn {
    border:none;border-radius:20px;padding:16px 12px;
    font-family:'M PLUS Rounded 1c',sans-serif;font-size:1rem;font-weight:800;
    cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .choice-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,0.15);}
  .choice-btn .btn-icon{font-size:1.8rem;}
  .btn-fruit  { background:linear-gradient(135deg,#FF8C8C,#FF5252);color:white; }
  .btn-veggie { background:linear-gradient(135deg,#6FCF97,#27AE60);color:white; }
  .choice-btn:disabled{opacity:0.5;cursor:default;}

  /* RESULT */
  .result-box {
    border-radius:20px;padding:16px 20px;margin-bottom:14px;
    font-weight:700;text-align:center;
    animation:slideDown 0.3s ease;display:none;
  }
  @keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
  .result-box.correct{background:#E8F5E9;color:#2E7D32;border:2px solid #81C784;display:block;}
  .result-box.wrong  {background:#FFEBEE;color:#C62828;border:2px solid #EF9A9A;display:block;}
  .result-icon{font-size:2rem;display:block;margin-bottom:4px;}
  .result-explain{font-size:0.82rem;font-weight:400;color:#555;margin-top:6px;line-height:1.6;}

  .next-btn {
    width:100%;background:linear-gradient(135deg,#FFD93D,#FF9800);
    color:#3D2B1F;border:none;border-radius:20px;padding:14px;
    font-family:'M PLUS Rounded 1c',sans-serif;font-size:1.1rem;font-weight:800;
    cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.15);display:none;
  }
  .next-btn:active{transform:translateY(3px);}

  /* FINISH */
  .finish-box{background:rgba(255,255,255,0.95);border-radius:28px;padding:28px 24px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.12);display:none;}
  .finish-box.show{display:block;}
  .finish-emoji{font-size:4rem;margin-bottom:8px;}
  .finish-box h2{font-size:1.4rem;font-weight:800;margin-bottom:8px;}
  .big-score{font-size:2.8rem;font-weight:800;color:var(--fruit-color);}
  .finish-msg{color:#666;font-size:0.9rem;margin:10px 0 18px;line-height:1.6;}
  .restart-btn{background:linear-gradient(135deg,#FF8C8C,#FF5252);color:white;border:none;border-radius:20px;padding:14px 32px;font-family:'M PLUS Rounded 1c',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.15);}
</style>
</head>
<body>
<div class="sky-bg"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="ground-strip"></div>
<div class="tree-scene">
  <div class="tree-top"></div>
  <div class="tree-trunk"></div>
</div>

<div class="container">
  <div class="title-box">
    <h1>🍎 くだもの・やさい<br>わけてみよう！</h1>
    <p>しょうがっこうじゅけん たいさく</p>
  </div>

  <div class="rule-box">
    <h3>📌 おぼえておこう！</h3>
    <div class="rule-item">
      <span class="rule-icon">🍎</span>
      <div><strong>くだもの</strong>…🌳きや、なんねんも いきる くさに なる み。あまくて そのまま たべるもの！</div>
    </div>
    <div class="rule-item">
      <span class="rule-icon">🥕</span>
      <div><strong>やさい</strong>…🌱いちねんで そだつ くさの しょくぶつ。りょうりに つかうもの！</div>
    </div>
  </div>

  <div class="score-bar">
    <div class="score-item score-correct">
      <div class="score-num" id="scoreCorrect">0</div>
      <div class="score-label">せいかい</div>
    </div>
    <div class="score-item">
      <div class="score-num" id="scoreCurrent">0</div>
      <div class="score-label">もんめ</div>
    </div>
    <div class="score-item">
      <div class="score-num" id="scoreTotal">0</div>
      <div class="score-label">ぜんぶ</div>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div id="quizSection">
    <div class="card">
      <span class="food-emoji" id="foodEmoji">🍎</span>
      <div class="food-name" id="foodName">りんご</div>
      <div class="choice-row">
        <button class="choice-btn btn-fruit" id="btnFruit" onclick="answer('fruit')">
          <span class="btn-icon">🍎</span>くだもの
        </button>
        <button class="choice-btn btn-veggie" id="btnVeggie" onclick="answer('veggie')">
          <span class="btn-icon">🥕</span>やさい
        </button>
      </div>
    </div>

    <div class="result-box" id="resultBox">
      <span class="result-icon" id="resultIcon"></span>
      <div id="resultText"></div>
      <div class="result-explain" id="resultExplain"></div>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">つぎのもんだいへ ➜</button>
  </div>

  <div class="finish-box" id="finishBox">
    <div class="finish-emoji" id="finishEmoji">🎉</div>
    <h2>ぜんもんおわったよ！</h2>
    <div class="big-score"><span id="finalScore">0</span> / <span id="finalTotal">0</span></div>
    <div class="finish-msg" id="finishMsg"></div>
    <button class="restart-btn" onclick="restart()">もう一度チャレンジ！ 🔄</button>
  </div>
</div>

<script>
const foods = [
  { name:'りんご',       emoji:'🍎', type:'fruit',  hint:'🌳 りんごの きに なる みだよ！あかくておいしい！' },
  { name:'バナナ',       emoji:'🍌', type:'fruit',  hint:'🌳 バナナの きに なるよ。あまくてトロピカル！' },
  { name:'イチゴ',       emoji:'🍓', type:'fruit',  hint:'🌱 ひくい くさに なるけど、なんねんも いきる くさだから くだもの！' },
  { name:'スイカ',       emoji:'🍉', type:'veggie', hint:'🌱 いちねんで そだつ ツルに なる。あまくても やさい！' },
  { name:'メロン',       emoji:'🍈', type:'veggie', hint:'🌱 スイカと おなじ、いちねんで そだつ ツルに なる。やさいだけど あまい！' },
  { name:'トマト',       emoji:'🍅', type:'veggie', hint:'🌱 いちねんで そだつ くさに なる。りょうりに よく つかうから やさい！' },
  { name:'キュウリ',     emoji:'🥒', type:'veggie', hint:'🌱 いちねんで そだつ ツルに なる みどりの やさい！' },
  { name:'ナス',         emoji:'🍆', type:'veggie', hint:'🌱 いちねんで そだつ くさに なる むらさきの やさい！' },
  { name:'みかん',       emoji:'🍊', type:'fruit',  hint:'🌳 みかんの きに なる み。ふゆに おいしい！' },
  { name:'ぶどう',       emoji:'🍇', type:'fruit',  hint:'🌳 ぶどうの き（ツル）に なるよ。ちいさい みが いっぱい！' },
  { name:'もも',         emoji:'🍑', type:'fruit',  hint:'🌳 もものきに なる、あまくてやわらかい くだもの！' },
  { name:'かき',         emoji:'🟠', type:'fruit',  hint:'🌳 かきの きに なる オレンジの み。あきに おいしい！' },
  { name:'にんじん',     emoji:'🥕', type:'veggie', hint:'🌱 つちの なかで そだつ ねっこ。いちねんで そだつから やさい！' },
  { name:'たまねぎ',     emoji:'🧅', type:'veggie', hint:'🌱 つちの なかで そだつ やさい。はっぱの ねもとが おおきく なったよ！' },
  { name:'キャベツ',     emoji:'🥬', type:'veggie', hint:'🌱 はっぱを たべる やさい。まるまる おおきい！' },
  { name:'レモン',       emoji:'🍋', type:'fruit',  hint:'🌳 レモンの きに なる きいろい み。すっぱいけど くだもの！' },
  { name:'パイナップル', emoji:'🍍', type:'fruit',  hint:'🌱 なんねんも いきる ひくい くさに なる み。だから くだもの！' },
  { name:'カボチャ',     emoji:'🎃', type:'veggie', hint:'🌱 いちねんで そだつ ツルに なる。りょうりに つかうから やさい！' },
  { name:'とうもろこし', emoji:'🌽', type:'veggie', hint:'🌱 いちねんで そだつ くきに なる。あまくても やさい！' },
  { name:'さくらんぼ',   emoji:'🍒', type:'fruit',  hint:'🌳 さくらんぼの きに なる ちいさい あかい み。くだもの！' },
  { name:'なし',         emoji:'🍐', type:'fruit',  hint:'🌳 なしの きに なる まるい み。シャリシャリして あまい！' },
  { name:'いちご',       emoji:'🍓', type:'fruit',  hint:'🌱 なんねんも いきる くさに なるから くだもの！あまくておいしい。' },
  { name:'くり',         emoji:'🌰', type:'fruit',  hint:'🌳 くりの きに なる み。イガイガに つつまれているよ！' },
  { name:'キウイ',       emoji:'🥝', type:'fruit',  hint:'🌳 キウイの き（ツル）に なる ちゃいろい くだもの。なかは みどり！' },
  { name:'さつまいも',   emoji:'🍠', type:'veggie', hint:'🌱 つちの なかで そだつ あまい ねっこ。いちねんで そだつから やさい！' },
  { name:'だいこん',     emoji:'🫚', type:'veggie', hint:'🌱 つちの なかで そだつ しろい ねっこ。おでんに はいる やさい！' },
  { name:'ごぼう',       emoji:'🪵', type:'veggie', hint:'🌱 ほそながく つちの なかで そだつ ねっこ。やさい！' },
  { name:'ほうれんそう', emoji:'🥬', type:'veggie', hint:'🌱 はっぱを たべる いちねんで そだつ やさい！' },
  { name:'えだまめ',     emoji:'🫛', type:'veggie', hint:'🌱 いちねんで そだつ まめの さや。やさい！' },
  { name:'ピーマン',     emoji:'🫑', type:'veggie', hint:'🌱 いちねんで そだつ くさに なる みどりの み。やさい！' },
  { name:'はくさい',     emoji:'🥬', type:'veggie', hint:'🌱 はっぱを たべる いちねんで そだつ やさい。なべりょうりに つかうよ！' },
];

let shuffled = [], current = 0, correct = 0, answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function loadQuestion() {
  answered = false;
  const q = shuffled[current];
  document.getElementById('foodEmoji').textContent = q.emoji;
  document.getElementById('foodName').textContent = q.name;
  document.getElementById('resultBox').className = 'result-box';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('btnFruit').disabled = false;
  document.getElementById('btnVeggie').disabled = false;
  const em = document.getElementById('foodEmoji');
  em.style.animation = 'none';
  setTimeout(() => { em.style.animation = 'popIn 0.4s cubic-bezier(0.34,1.56,0.64,1)'; }, 10);
  document.getElementById('scoreCurrent').textContent = current + 1;
  document.getElementById('scoreTotal').textContent = shuffled.length;
  document.getElementById('progressFill').style.width = (current / shuffled.length * 100) + '%';
}

function answer(choice) {
  if (answered) return;
  answered = true;
  const q = shuffled[current];
  const isCorrect = choice === q.type;
  if (isCorrect) correct++;
  document.getElementById('btnFruit').disabled = true;
  document.getElementById('btnVeggie').disabled = true;
  document.getElementById('scoreCorrect').textContent = correct;

  const box = document.getElementById('resultBox');
  if (isCorrect) {
    box.className = 'result-box correct';
    document.getElementById('resultIcon').textContent = '⭕';
    document.getElementById('resultText').textContent = 'せいかい！すごい！';
  } else {
    box.className = 'result-box wrong';
    document.getElementById('resultIcon').textContent = '❌';
    const label = q.type === 'fruit' ? 'くだもの' : 'やさい';
    document.getElementById('resultText').textContent = `ざんねん… こたえは「${label}」だよ！`;
  }
  // ヒントは答えたあとだけ表示
  document.getElementById('resultExplain').textContent = q.hint;
  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  current++;
  if (current >= shuffled.length) showFinish();
  else loadQuestion();
}

function showFinish() {
  document.getElementById('quizSection').style.display = 'none';
  document.getElementById('finishBox').classList.add('show');
  document.getElementById('finalScore').textContent = correct;
  document.getElementById('finalTotal').textContent = shuffled.length;
  const pct = correct / shuffled.length;
  let msg, emoji;
  if (pct === 1)     { emoji='🏆'; msg='ぜんぶせいかい！かんぺき！くだものと やさいは バッチリだね！'; }
  else if (pct>=0.8) { emoji='🌟'; msg='とてもよくできました！もうすこしで かんぺき！'; }
  else if (pct>=0.6) { emoji='😊'; msg='なかなかいいね！まちがえたところを もう一どみてみよう！'; }
  else               { emoji='💪'; msg='もう一どチャレンジしてみよう！だんだんわかってくるよ！'; }
  document.getElementById('finishEmoji').textContent = emoji;
  document.getElementById('finishMsg').textContent = msg;
  document.getElementById('progressFill').style.width = '100%';
}

function restart() {
  current = 0; correct = 0;
  shuffled = shuffle(foods);
  document.getElementById('quizSection').style.display = 'block';
  document.getElementById('finishBox').classList.remove('show');
  document.getElementById('scoreCorrect').textContent = '0';
  loadQuestion();
}

shuffled = shuffle(foods);
document.getElementById('scoreTotal').textContent = shuffled.length;
loadQuestion();
</script>
</body>
</html>
